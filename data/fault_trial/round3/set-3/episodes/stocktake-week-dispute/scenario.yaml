id: EP-stocktake-week-dispute
title: Two sources disagree about the stocktake week only; the ERP settles it
model: capacity_plan
interpreter_version: "fixture:capacity-reader@1"
source_priority: {"portal:supplier": 2, "email:planner": 1}
world:
  plant: X
  horizon: [41, 42, 43, 44, 45]
  nominal_capacity: 1000
  demand_per_week: 1000
  erp_source_id: "erp:capacity-master"
times: {erp_load: 1}
events:
  - {id: msg-x-stocktake, t: 2, kind: message, source: "email:planner",
     text: "Plant X: week 44 capacity about 800 units because of the annual stocktake.",
     fixture: fixtures/planner.json}
  - {id: msg-x-portal44, t: 3, kind: message, source: "portal:supplier",
     text: "Plant X declares 600 units for week 44.",
     fixture: fixtures/portal.json}
  - {t: 4, kind: decide}
  - {id: erp-x-week44, t: 5, kind: record, source: "erp:capacity-master",
     ops: [{op: supersede, subject: "plant:X", predicate: capacity, value: 650,
            unit: "units/week", valid_from: 44, valid_to: 45}]}
  - {t: 6, kind: decide}
trial:
  gate: nominal
  resolution: block
  supersession: none
  threshold_rules: []
  declared_versions: []
  system_of_record: {}
