id: EP-recheck-master-revision
title: Execution-time recheck; the capacity master is revised between two releases
model: capacity_plan
interpreter_version: "fixture:capacity-reader@1"
source_priority: {"email:planner": 1}
world:
  plant: X
  horizon: [41, 42, 43, 44, 45]
  nominal_capacity: 1000
  demand_per_week: 1000
  erp_source_id: "erp:capacity-master"
times: {erp_load: 1}
events:
  - {id: msg-x-reduction, t: 2, kind: message, source: "email:planner-inbox",
     text: "Plant X update: capacity reduced by about 30% for weeks 42-44.",
     fixture: fixtures/notice.json}
  - {t: 3, kind: decide}
  - {t: 4, kind: sor, values: {"plant:X|capacity|43": 650}}
  - {t: 5, kind: decide}
trial:
  gate: recheck
  fallback: resolve
  supersession: none
  threshold_rules: []
  declared_versions: []
  system_of_record: {"plant:X|capacity|42": 700, "plant:X|capacity|43": 700,
                     "plant:X|capacity|44": 700}
