id: EP-span-planner-and-portal
title: Supplier portal and planner disagree; span resolution under the box-robust gate
model: capacity_plan
interpreter_version: "fixture:capacity-reader@1"
source_priority: {"email:planner": 2, "portal:supplier": 1}
world:
  plant: X
  horizon: [41, 42, 43, 44, 45]
  nominal_capacity: 1000
  demand_per_week: 1000
  erp_source_id: "erp:capacity-master"
times: {erp_load: 1}
events:
  - {id: msg-portal-x, t: 2, kind: message, source: "portal:supplier",
     text: "Plant X capacity for weeks 42-44: 600 units per week.",
     fixture: fixtures/portal.json}
  - {id: msg-planner-x, t: 3, kind: message, source: "email:planner",
     text: "Spoke with the Plant X scheduler: capacity down about 30% for weeks 42-44.",
     fixture: fixtures/planner.json}
  - {t: 4, kind: decide}
trial:
  gate: box_robust
  resolution: span
  supersession: none
  threshold_rules: []
  declared_versions: []
  system_of_record: {}
