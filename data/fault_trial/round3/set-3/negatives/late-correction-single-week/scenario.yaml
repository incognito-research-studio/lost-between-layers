id: NEG-late-correction-single-week
title: A released plan is re-planned after the plant narrows its reduction to one week
model: capacity_plan
interpreter_version: "fixture:capacity-reader@1"
source_priority: {}
world:
  plant: X
  horizon: [41, 42, 43, 44, 45]
  nominal_capacity: 1000
  demand_per_week: 900
  erp_source_id: "erp:capacity-master"
times: {erp_load: 1}
events:
  - {id: msg-x-reduce, t: 2, kind: message, source: "email:planner-inbox",
     text: "Plant X: capacity about 600 units per week in weeks 43-44 due to a supplier shortage.",
     fixture: fixtures/notice.json}
  - {t: 3, kind: decide}
  - {id: msg-x-narrow, t: 5, kind: message, source: "email:planner-inbox",
     text: "Correction: the shortage affects week 44 only. Week 43 runs at the full 1000 units.",
     fixture: fixtures/correction.json}
  - {t: 6, kind: decide}
trial:
  gate: nominal
  supersession: none
  threshold_rules: []
  declared_versions: []
  system_of_record: {}
