id: EP-PLANT-X-CONTESTED-WEEK45
title: Contradictory notices about the last planning week, settled by the master
model: capacity_plan
interpreter_version: "fixture:plant-notices@1"
source_priority: {"portal:supplier": 2, "email:planner": 1}
world:
  plant: X
  horizon: [41, 42, 43, 44, 45]
  nominal_capacity: 1000
  demand_per_week: 1000
  erp_source_id: "erp:capacity-master"
  true_capacity: {45: 700}
times: {erp_load: 1}
events:
  - {id: msg-portal-45, t: 2, kind: message, source: "portal:supplier",
     text: "Plant X capacity for weeks 45-46: 600 units per week.",
     fixture: fixtures/portal.json}
  - {id: msg-planner-45, t: 3, kind: message, source: "email:planner",
     text: "Plant X expects about 800 units per week in weeks 45-46 once the new shift starts.",
     fixture: fixtures/planner.json}
  - {t: 4, kind: decide}
  # The capacity master settles weeks 45-46 after the plant confirms the shift pattern.
  - {id: erp-confirm, t: 6, kind: record, source: "erp:capacity-master",
     ops: [{op: supersede, subject: "plant:X", predicate: capacity, value: 700,
            unit: "units/week", valid_from: 45, valid_to: 47}]}
  - {t: 7, kind: decide}
trial:
  gate: nominal
  resolution: block
  supersession: none
  threshold_rules: []
  declared_versions: []
  system_of_record: {}
