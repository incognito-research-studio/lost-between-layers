id: EP-LOT-L2-APPROVAL-ONLY
title: QA has released lot L2, lot L1 still awaits its release approval
model: lot_allocation
interpreter_version: "fixture:inventory-notices@1"
source_priority: {"email:warehouse": 1}
world:
  period: 42
  demand: 600
  erp_source_id: "erp:inventory"
  lots:
    L1: {qty: 500, hold: 0}
    L2: {qty: 300, hold: 0}
times: {erp_load: 1}
events:
  - {t: 2, kind: approval, approval_id: apr-l2, approval_kind: lot-release,
     variable: "x[L2]", approver: qa.manager, source: "idp:qa-approvals", expires_at: 12}
  - {t: 3, kind: decide}
trial:
  gate: nominal
  resolution: latest
  supersession: none
  threshold_rules: [{kind: lot-release, variable: "x[L1]", approvers: [qa.manager]},
                    {kind: lot-release, variable: "x[L2]", approvers: [qa.manager]}]
  declared_versions: []
  system_of_record: {}
