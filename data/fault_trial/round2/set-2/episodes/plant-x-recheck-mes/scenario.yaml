id: EP-PLANT-X-RECHECK-MES
title: Execution-time re-read of the MES rate, which changes after release
model: capacity_plan
interpreter_version: "fixture:plant-notices@1"
source_priority: {"email:planner-inbox": 1}
world:
  plant: X
  horizon: [41, 42, 43, 44, 45]
  nominal_capacity: 1000
  demand_per_week: 1000
  erp_source_id: "erp:capacity-master"
  true_capacity: {42: 680, 43: 680, 44: 680}
times: {erp_load: 1}
events:
  - {id: msg-cut, t: 2, kind: message, source: "email:planner-inbox",
     text: "Plant X update: capacity reduced by about 30% for weeks 42-44.",
     fixture: fixtures/cut.json}
  - {t: 3, kind: decide}
  # After the release the MES posts a better demonstrated rate for weeks 42-44.
  - {t: 4, kind: sor, values: {"plant:X|capacity|42": 720, "plant:X|capacity|43": 720,
                               "plant:X|capacity|44": 720}}
trial:
  gate: recheck
  fallback: resolve
  resolution: latest
  supersession: none
  threshold_rules: []
  declared_versions: []
  system_of_record: {}
