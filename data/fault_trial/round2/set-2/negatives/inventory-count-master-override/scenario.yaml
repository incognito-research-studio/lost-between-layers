id: NEG-INVENTORY-COUNT-MASTER-OVERRIDE
title: Posted cycle count in the inventory master supersedes a warehouse e-mail
model: lot_allocation
interpreter_version: "fixture:inventory-notices@1"
source_priority: {"email:warehouse": 2, "erp:inventory": 1}
world:
  period: 42
  demand: 800
  erp_source_id: "erp:inventory"
  lots:
    L1: {qty: 500, hold: 0}
    L2: {qty: 300, hold: 0}
times: {erp_load: 1}
events:
  - {id: msg-l2-count, t: 2, kind: message, source: "email:warehouse",
     text: "Quick count on the floor: lot L2 looks like 250 units.",
     fixture: fixtures/count.json}
  - {t: 3, kind: decide}
  - {id: inv-posting, t: 5, kind: record, source: "erp:inventory",
     ops: [{op: assert, subject: "lot:L2", predicate: qty, value: 270,
            valid_from: 42, valid_to: 43}]}
  - {t: 6, kind: decide}
trial:
  gate: nominal
  resolution: latest
  supersession: authenticated_latest
  threshold_rules: []
  declared_versions: []
  system_of_record: {}
