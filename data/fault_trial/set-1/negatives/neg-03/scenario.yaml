# The deployment pins interpreter fixture:neg03@1. A candidate model, fixture:neg03@2,
# is being evaluated but has not been promoted; the deployment declares it and refuses
# its outputs on purpose. The first notice is answered by the candidate (a correct
# reading, but from the unpromoted version), so L1's output is refused and the cycle at
# t = 3 plans on the master baseline. The planner re-sends the notice after the
# routing is switched back; the pinned version answers and the cut is applied at t = 5.
id: NEG-03
title: Notice answered by an unpromoted candidate interpreter
status: negative
model: capacity_plan
interpreter_version: "fixture:neg03@1"
source_priority: {"email:planner-inbox": 1}

world:
  plant: X
  horizon: [41, 42, 43, 44, 45]
  nominal_capacity: 1000
  demand_per_week: 1000
  erp_source_id: "erp:capacity-master"
  true_capacity: {43: 690, 44: 690}

times: {erp_load: 1}

events:
  - {id: msg-first, t: 2, kind: message, source: "email:planner-inbox",
     text: "Plant X update: capacity reduced by about 30% for weeks 43-44.",
     fixture: fixtures/candidate.json}
  - {t: 3, kind: decide}
  - {id: msg-resent, t: 4, kind: message, source: "email:planner-inbox",
     text: "Resending: Plant X update: capacity reduced by about 30% for weeks 43-44.",
     fixture: fixtures/pinned.json}
  - {t: 5, kind: decide}

trial:
  gate: nominal
  resolution: latest
  supersession: none
  threshold_rules: []
  declared_versions: ["fixture:neg03@2"]
  system_of_record: {}

required_response: "Refuse the declared candidate's output (nu_I mismatch); apply the pinned reading"
expected:
  ingest_msg_first: abstained
  ingest_msg_resent: committed
  release_t3: {41: 1000, 42: 1000, 43: 1000, 44: 1000, 45: 1000}
  release_t5: {41: 1000, 42: 1000, 43: 700, 44: 700, 45: 1000}
