# Pinned version vector nu (Def. 5, design rule 3 "Versions are inputs").
# Every artifact whose change can alter a decision is listed here and copied into
# each audit record. Changing any value is a version bump (R5).
#
# `interpreter` is nu_I. It is part of nu here (audit item 2): a model update
# behind L1 changes interpreted state, and the record must attribute that change.
formulation: capacity-plan@1
solver: scipy-highs@deterministic-1   # method=highs, presolve on; thread count left at the HiGHS default
kappa: canon@1                        # canonicalizer (Def. 4, Lemma 1a)
projection: l1-lp@1                   # gate projection P_F in the l1 norm
sop: sop-graph@1
interpreter: fixture@1                # e.g. claude-opus-5-5 when L1 is live
resolution: latest@1                  # L3 conflict policy: latest | priority | span | block
confidence: "0.5/0.9"                 # yes/no readings: conf < 0.5 abstain, [0.5, 0.9) -> [0, 1]
