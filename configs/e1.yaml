# E1: live L1 interpreter calibration and the gate ladder (follow-up paper).
# Commands that call the API spend money and need --yes; the ledger enforces budget_usd.
name: e1
seed: 20261019
notices: {n_per_category: 22}          # 11 categories -> 242 notices
models: [claude-haiku-5-5, claude-sonnet-5-5, claude-opus-5-5]   # cheapest first
effort: medium                         # pinned for every model (part of nu_I)
max_tokens: 8000
repeats: 3                             # per notice and model, for run-to-run variance
use_fallbacks: false                   # measure each model as itself; refusals count as abstentions
budget_usd: 25.0                       # hard cap across pilot and main run
safety_factor: 1.5                     # on per-request cost estimates
pilot: {n_notices: 11}                 # one per category, live, full price
batch_discount: 0.5
# Prices cached from the Claude API reference on 2026-10-06; confirm on the pricing page.
rates_usd_per_mtok:
  claude-opus-5-5: {input: 4.00, output: 20.00}
  claude-sonnet-5-5: {input: 2.00, output: 10.00}
  claude-haiku-5-5: {input: 0.10, output: 0.50}
world: {plant: X, nominal_capacity: 1000, demand_per_week: 1000}
